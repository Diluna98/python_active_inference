[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["PyAIF", "PyAIF.inference", "PyAIF.likelihoods"]
include-package-data = false

[tool.setuptools.exclude-package-data]
PyAIF = ["likelihood_models/*.py", "likelihood_models/*.npz"]
"PyAIF.likelihood_models" = ["*"]

[project]
name = "PyAIF"
version = "0.1.0"
description = "A Python package for Active Inference agents and simulations"
authors = [
  { name = "Diluna A. Warnakulasuriya" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "joblib"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/Diluna98/python_active_inference"
